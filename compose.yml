name: ichat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Match compose.prod.yml: leave headroom for the API and worker
    # SQLAlchemy pools across multiple worker replicas.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Shared broker/cache/stream transport. Celery requires noeviction too.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
    - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    image: ichat-api:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    image: ichat-api:local
    env_file:
      - .env
    environment:
      # API owns upload/canonical-download/preview-display signing only.
      FILES_WORKER_ACCESS_KEY_ID: ""
      FILES_WORKER_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_LLM_ACCESS_KEY_ID: ""
      FILES_PREVIEW_LLM_SECRET_ACCESS_KEY: ""
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:?API_PORT is required}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    environment:
      FILE_UPLOAD_ENABLED: "false"
      FILES_UPLOAD_ACCESS_KEY_ID: ""
      FILES_UPLOAD_SECRET_ACCESS_KEY: ""
      FILES_STAGING_BUCKET: ""
      FILES_CANONICAL_BUCKET: ""
      FILES_WORKER_ACCESS_KEY_ID: ""
      FILES_WORKER_SECRET_ACCESS_KEY: ""
      FILES_DOWNLOAD_ACCESS_KEY_ID: ""
      FILES_DOWNLOAD_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_API_ACCESS_KEY_ID: ""
      FILES_PREVIEW_API_SECRET_ACCESS_KEY: ""
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    environment:
      FILE_UPLOAD_ENABLED: "false"
      FILES_UPLOAD_ACCESS_KEY_ID: ""
      FILES_UPLOAD_SECRET_ACCESS_KEY: ""
      FILES_WORKER_ACCESS_KEY_ID: ""
      FILES_WORKER_SECRET_ACCESS_KEY: ""
      FILES_DOWNLOAD_ACCESS_KEY_ID: ""
      FILES_DOWNLOAD_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_API_ACCESS_KEY_ID: ""
      FILES_PREVIEW_API_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_LLM_ACCESS_KEY_ID: ""
      FILES_PREVIEW_LLM_SECRET_ACCESS_KEY: ""
    # Executes email and finite LLM tasks (conversation titles). Safe to scale to N.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  media-worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    environment:
      FILE_UPLOAD_ENABLED: "false"
      FILES_UPLOAD_ACCESS_KEY_ID: ""
      FILES_UPLOAD_SECRET_ACCESS_KEY: ""
      FILES_WORKER_ACCESS_KEY_ID: ""
      FILES_WORKER_SECRET_ACCESS_KEY: ""
      FILES_DOWNLOAD_ACCESS_KEY_ID: ""
      FILES_DOWNLOAD_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_API_ACCESS_KEY_ID: ""
      FILES_PREVIEW_API_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_LLM_ACCESS_KEY_ID: ""
      FILES_PREVIEW_LLM_SECRET_ACCESS_KEY: ""
    # CPU-bound avatar validation and transcoding stays off the email queue.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=media", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4-debian
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --wait /etc/hosts >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  file-worker:
    build:
      context: .
    image: ichat-worker:local
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    # Deliberately do not use env_file: this process receives only its private
    # buckets plus PG/broker/ClamAV. LLM, email, avatar and purge secrets never
    # enter the untrusted document-processing container.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ""
      # Disabled here means "do not create sessions" only.  The files queue
      # still drains existing PostgreSQL facts using the worker credentials.
      FILE_UPLOAD_ENABLED: "false"
      FILES_R2_ENDPOINT_URL: ${FILES_R2_ENDPOINT_URL:-}
      FILES_R2_REGION: ${FILES_R2_REGION:-auto}
      FILES_STAGING_BUCKET: ${FILES_STAGING_BUCKET:-}
      FILES_CANONICAL_BUCKET: ${FILES_CANONICAL_BUCKET:-}
      FILES_PREVIEW_BUCKET: ${FILES_PREVIEW_BUCKET:-}
      FILES_WORKER_ACCESS_KEY_ID: ${FILES_WORKER_ACCESS_KEY_ID:-}
      FILES_WORKER_SECRET_ACCESS_KEY: ${FILES_WORKER_SECRET_ACCESS_KEY:-}
      FILES_R2_CONNECT_TIMEOUT_SECONDS: ${FILES_R2_CONNECT_TIMEOUT_SECONDS:-5}
      FILES_R2_READ_TIMEOUT_SECONDS: ${FILES_R2_READ_TIMEOUT_SECONDS:-30}
      FILES_R2_MAX_ATTEMPTS: ${FILES_R2_MAX_ATTEMPTS:-3}
      FILES_PROCESSING_LEASE_SECONDS: ${FILES_PROCESSING_LEASE_SECONDS:-300}
      FILES_PROCESSING_MAX_ATTEMPTS: ${FILES_PROCESSING_MAX_ATTEMPTS:-3}
      FILES_PARSER_TIMEOUT_SECONDS: ${FILES_PARSER_TIMEOUT_SECONDS:-120}
      FILES_ATTEMPT_TIMEOUT_SECONDS: ${FILES_ATTEMPT_TIMEOUT_SECONDS:-180}
      FILES_MAINTENANCE_INTERVAL_SECONDS: ${FILES_MAINTENANCE_INTERVAL_SECONDS:-60}
      FILES_MAINTENANCE_BATCH_SIZE: ${FILES_MAINTENANCE_BATCH_SIZE:-100}
      FILES_CLEANUP_SAFETY_SECONDS: ${FILES_CLEANUP_SAFETY_SECONDS:-300}
      FILES_DETACHED_RETENTION_SECONDS: ${FILES_DETACHED_RETENTION_SECONDS:-2592000}
      CONVERSATION_DELETION_RETENTION_SECONDS: ${CONVERSATION_DELETION_RETENTION_SECONDS:-2592000}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      CLAMAV_SIGNATURE_MAX_AGE_SECONDS: ${CLAMAV_SIGNATURE_MAX_AGE_SECONDS:-172800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: file-worker-unused-not-a-real-secret
      JWT_ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "2592000"
      DEEPSEEK_API_KEY: file-worker-unused
      DEEPSEEK_BASE_URL: https://disabled.invalid
      DEEPSEEK_MODEL: disabled
      DEEPSEEK_THINKING_ENABLED: "false"
      RUN_LEASE_SECONDS: "60"
      WORKER_POLL_INTERVAL_SECONDS: "30"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "10"
      SUMMARY_PROVIDER_NAME: deepseek
      SUMMARY_MODEL: disabled
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=files", "--concurrency=2", "--prefetch-multiplier=1", "--max-tasks-per-child=${FILES_WORKER_MAX_TASKS_PER_CHILD:-50}"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  celery-beat:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    environment:
      FILE_UPLOAD_ENABLED: "false"
      FILES_UPLOAD_ACCESS_KEY_ID: ""
      FILES_UPLOAD_SECRET_ACCESS_KEY: ""
      FILES_WORKER_ACCESS_KEY_ID: ""
      FILES_WORKER_SECRET_ACCESS_KEY: ""
      FILES_DOWNLOAD_ACCESS_KEY_ID: ""
      FILES_DOWNLOAD_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_API_ACCESS_KEY_ID: ""
      FILES_PREVIEW_API_SECRET_ACCESS_KEY: ""
      FILES_PREVIEW_LLM_ACCESS_KEY_ID: ""
      FILES_PREVIEW_LLM_SECRET_ACCESS_KEY: ""
    # Schedules email and avatar maintenance. Must be a single instance
    # (multiple beats double-schedule). Execution happens on queue workers.
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  clamav_data:
