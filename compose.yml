name: ichat

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    # Match compose.prod.yml: leave headroom for the API and worker
    # SQLAlchemy pools across multiple worker replicas.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Shared broker/cache/stream transport. Celery requires noeviction too.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
    - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    image: ichat-api:local
    env_file:
      - .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    image: ichat-api:local
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:?API_PORT is required}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    # Executes email and finite LLM tasks (conversation titles). Safe to scale to N.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  media-worker:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    # CPU-bound avatar validation and transcoding stays off the email queue.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=media", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
    image: ichat-worker:local
    env_file:
      - .env
    # Schedules email and avatar maintenance. Must be a single instance
    # (multiple beats double-schedule). Execution happens on queue workers.
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
