cted)}.result:hover{background:var(--result-hover)}.result-icon{width:20px;height:20px}.result-main{flex:1;min-width:0}.result-title{font-size:14px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:22px}.result-snippet{font-size:12px;line-height:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}.result b{font-weight:650;color:var(--fg)}.result-date{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center;min-width:50px;text-align:right;margin-left:8px}.result.recent .result-date{display:none}.empty-state{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;color:var(--faint)}.empty-state>svg{width:24px;height:24px;stroke-width:1.3;margin-bottom:3px}.empty-state p{font-size:14px;margin:0;color:var(--muted)}.empty-state small{font-size:12px;max-width:270px}.retry{border:1px solid var(--line-strong);border-radius:8px;padding:6px 16px;font-size:12px;color:var(--fg);margin-top:7px;background:#fff}.retry:hover{background:var(--sunken)}.skeleton-row{height:64px;display:flex;align-items:center;gap:14px;padding:10px 12px}.skeleton-icon{width:28px;height:28px;border-radius:7px;flex-shrink:0}.skeleton-copy{flex:1}.skeleton-line{height:10px;margin:8px 0;border-radius:5px;width:75%}.skeleton-line:first-child{width:38%}.skeleton{background:linear-gradient(100deg,#efefee 25%,#f8f8f7 48%,#efefee 70%);background-size:250% 100%;animation:shimmer 1.5s infinite}.more-state{text-align:center;font-size:12px;color:var(--muted);padding:16px 10px 8px}.more-state p{margin:0 0 5px}.more-state .retry{margin-top:0}.spinner{display:inline-block;width:15px;height:15px;border:1.5px solid #ddd;border-top-color:#777;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}.validation{font-size:12px;color:#a6402b;padding:0 24px 8px}.search-bottom-line{border-top:1px solid var(--line);height:1px;position: <body>
<header class="lab-top">
  <div class="lab-id"><div class="lab-mark" data-icon="search"></div><div><div class="lab-title">对话搜索 <span style="color:#999;font-weight:400">/ 界面设计</span></div><div class="lab-sub">Piko · 交互样稿 · 2026.09.05</div></div></div>
  <div class="lab-tools"><div class="segmented" aria-label="预览尺寸"><button data-view="desktop" aria-pressed="true">桌面</button><button data-view="mobile" aria-pressed="false">移动端</button></div><button class="lab-button" id="lab-open">打开搜索</button><button class="lab-button dark" id="panel-toggle" aria-expanded="true">收起面板</button></div>
</header>
<div class="lab-work" id="lab-work">
  <div class="workspace" id="workspace"><div class="device" id="device">
    <div class="product-shell" id="product-shell">
      <div class="drawer-cover" id="drawer-cover"></div>
      <aside class="sidebar" id="sidebar" aria-label="对话导航">
        <div class="sidebar-top"><span class="brand">Piko</span><button class="icon-btn" id="sidebar-toggle" aria-label="收起侧栏" title="收起侧栏" data-icon="panel"></button></div>
        <nav class="sidebar-actions"><button class="nav-action" id="new-chat" title="新建对话" aria-label="新建对话"><span data-icon="new"></span><span class="nav-label">新建对话</span></button><button class="nav-action" id="open-search" title="搜索对话" aria-label="搜索对话"><span data-icon="search"></span><span class="nav-label">搜索对话</span></button><button class="nav-action rail-recent" id="recent-toggle" aria-label="最近对话" title="最近对话"><span data-icon="chat"></span></button></nav>
        <div class="sidebar-label">最近对话</div><div class="sidebar-list" id="sidebar-list"></div>
        <div class="account"><div class="avatar">嘉</div><div class="account-name">林嘉<br><small>个人账户</small></div></div>
      </aside>
      <main class="chat-page">
        <div class="thread-actions"><button class="icon-btn mobile-nav" id="mobile-menu" aria-label="打开侧栏" data-icon="panel"></button><button class="icon-btn desktop-action" id="share-demo" aria-label="分享对话" data-icon="share"></button><button class="icon-btn mobile-nav" id="mobile-new" aria-label="新建对话" data-icon="new"></button></div>
        <div class="thread-region" id="thread-region"><div class="messages focus-message" id="messages" tabindex="-1"></div><div class="composer-wrap"><div class="composer"><textarea id="composer" placeholder="向 Piko 提问" aria-label="消息草稿"></textarea><div class="composer-bottom"><div class="composer-left"><button class="icon-btn" id="attach-demo" aria-label="添加文件" data-icon="plus"></button><span class="model-label">Piko <span style="color:#b8b6b0">⌄</span></span></div><span class="send-icon" data-icon="up" aria-hidden="true"></span></div></div><div class="composer-foot">Piko 也可能会犯错，请核实重要信息。</div></div></div>
        <button class="bottom-button" id="scroll-bottom" aria-label="滚动到底部" data-icon="down" hidden></button>
      </main>
    </div>
    <div class="recent-popover" id="recent-popover" hidden><header>最近对话</header><div id="recent-list"></div></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="search-layer" id="search-layer" hidden>
      <div class="search-backdrop" id="search-backdrop"></div>
      <section class="search-dialog" role="dialog" aria-modal="true" aria-label="搜索对话" id="search-dialog">
        <div class="search-top"><input class="search-input" id="query" type="text" role="combobox" aria-label="搜索标题和正文" aria-controls="results" aria-expanded="true" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="搜索标题和正文"><button class="clear-search" id="clear-search" aria-label="清除搜索" hidden>清除</button><button class="icon-btn search-close" id="close-search" aria-label="关闭搜索" data-icon="close"></button></div>
        <div class="validation" id="validation" role="alert" hidden>搜索内容不能超过 200 个字符。</div>
        <div class="results-scroll" id="results-scroll"><div id="results" role="listbox" aria-label="对话"></div><div id="result-extra"></div></div>
        <div class="sr-only" role="status" id="search-announcement"></div>
      </section>
    </div>

 {id:'db',title:'周五的部署排查',updated:'2026-09-05T15:40:00+08:00',messages:[
 m('user','服务发布以后，偶尔会出现超时。可以一起梳理一下排查顺序吗？'),
 m('assistant','先把现象拆成两层：请求是在等待可用连接，还是已经进入执行阶段。\n\n从请求时间线看，连接池等待时间比 SQL 执行时间更值得先关注。我们可以先观察活跃连接数、等待队列长度，以及超时发生的时间点。'),
 m('user','我们之前提过数据库的连接池，这次是不是同一个问题？'),
 m('assistant','有可能，但先保留两种假设。\n\n如果请求一直在等待连接，应该检查连接是否及时释放；如果已经拿到连接，却仍然很慢，就需要看具体查询和锁等待。不要只调大上限。\n\n这两种情况看起来都是“超时”，解决方法却不同。'),
 m('user','可以给我一个最小的检查清单吗？'),
 m('assistant','可以，先按这个顺序检查：\n\n第一步：观察请求进入、获得连接和返回响应的时间。把等待与执行分开记录。\n\n第二步：核对连接池的使用量。峰值期间是否所有连接都被占用，是否存在长时间不结束的事务。\n\n第三步：检查数据库连接池配置，确认常驻连接数与临时连接数的总量适合当前 worker 数量。\n\n第四步：从一条明确超时的请求出发，沿着调用链检查每一次连接的申请与释放。\n\n先采样，再改动。保留一个可对比的基线，避免同时调整多个参数。',{rich:true}),
 m('user','明白了，我先收集一段高峰期的数据。'),m('assistant','好。保留请求耗时、连接等待时间和当时的连接数，下一次我们就可以直接对比同一时间窗口。') ]},
 {id:'poem',title:'推荐唐诗',updated:'2026-09-05T12:30:00+08:00',messages:[m('user','想读几首适合慢慢品味的唐诗。'),m('assistant','可以从《枫桥夜泊》《山居秋暝》和《春望》读起。\n\n先读出画面，再去理解诗人的处境。同一句诗，在不同年龄读，往往会看到不同的东西。'),m('user','最喜欢春望里写花和鸟的那一句。'),m('assistant','是，《春望》是真的越读越有味道。\n\n国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。\n\n景物没有改变，改变的是看景物的人。')]},
 {id:'title-db',title:'数据库设计笔记',updated:'2026-09-04T17:20:00+08:00',messages:[m('user','请帮我列出这次讨论的三个重点。'),m('assistant','一、先确定实体之间的关系。\n\n二、让每个状态只有一个事实来源。\n\n三、把约束写在可以验证它的边界上。')]},
 {id:'long',title:'从连接池到慢查询：一次关于高并发聊天服务、事务边界与数据库性能的完整讨论记录',updated:'2026-09-03T16:00:00+08:00',messages:[m('user','请给出一份完整的排查方案。'),m('assistant','这份方案会先建立观测基线，再区分连接池等待、事务锁等待和查询执行耗时。采样时应覆盖高峰与平峰两个窗口，同时记录 worker 数量、每个进程持有的连接数，以及请求被取消后事务是否及时结束。\n\n数据库性能问题应当从具体的慢请求入手，找到最先出现异常的那个阶段。')]},
 {id:'code',title:'SQLAlchemy 连接参数',updated:'2026-09-02T10:15:00+08:00',messages:[m('user','给我一个 Python 配置示例。'),m('assistant','下面是一份用于讨论的示例。具体数值需要根据服务负载调整。'),m('assistant','engine = create_async_engine(\n    database_url,\n    pool_size=10,\n    max_overflow=5,\n    pool_timeout=30,\n    pool_pre_ping=True,\n)',{format:'code'}),m('assistant','不要忘记把 worker 数量考虑进去。每个进程可能持有各自的连接池。')]},
 {id:'repeat',title:'重试与重复提交的边界',updated:'2026-09-01T14:30:00+08:00',messages:[m('user','幂等应该放在哪一层？'),m('assistant','幂等先从业务动作的定义开始。先明确两次请求是否表达同一个意图，再决定去重键的生命周期。'),m('user','如果请求已经成功，但响应在网络中丢失呢？'),m('assistant','首先区分执行结果和响应是否到达。响应丢失，不代表服务端没有完成操作。\n\n如果客户端重试时生成一个新的请求标识，服务端就无法判断这是一次重试，还是一个新的业务意图。\n\n因此，客户端需要在第一次提交前生成标识，并让后续重试沿用它。\n\n服务端应当把处理状态与业务结果一起保存。这样即使在返回响应前连接断开，也能在下一次请求中恢复同一份结果。\n\n对于还在处理中的动作，可以返回处理中状态，而不是同时启动第二次执行。\n\n对于已经失败的动作，应当区分可重试错误和最终错误，并为结果设置合理的保存期限。\n\n幂等需要让同一个业务意图在重复到达时返回已经确定的结果。我们约定同一个操作标识始终指向同一份结果。\n\n幂等也不意味着把所有相同内容都合并。两次相同金额的付款，可能对应两个完全不同的业务意图。',{rich:true}),m('assistant','继续阅读时不需要一直保留标记。短暂提醒后，正文应该回到正常样式。')]},
 {id:'quote',title:'把失败恢复的约定写下来',updated:'2026-08-31T09:30:00+08:00',messages:[m('assistant','每个操作都应该描述成功后的事实，以及重复执行时如何读取同一个结果。'),m('user','', {quote:'这一段引用保留了之前讨论的完整上下文。我们先区分请求有没有到达、动作有没有执行，以及结果有没有成功返回。不要把这三个不同阶段混成一个失败状态。为了让重试有明确的边界，还需要记录业务意图、处理状态、结果及其保存期限。对于已经成功的动作，不应该因为响应丢失而重新执行。这里最后需要明确的是：幂等性保护的是同一个业务意图，不能仅凭两段内容看起来一样就合并操作。'}),m('assistant','可以。我们会把这些约定写成可以验证的行为：重复提交不会产生第二次业务副作用，而是读取同一个结果。')]},

const ordered = [...conversations].sort((a,b)=>new Date(b.updated)-new Date(a.updated)||b.id.localeCompare(a.id));
// Search projection preserves a map back to original UTF-16 positions.
function project(text){let value='',starts=[],ends=[],space=false;for(let i=0;i<text.length;i++){let c=text[i];if(/\s/u.test(c)){if(value&&!space){value+=' ';starts.push(i);ends.push(i+1);space=true;}else if(space)ends[ends.length-1]=i+1;}else{value+=c.replace(/[A-Z]/g,x=>x.toLowerCase());starts.push(i);ends.push(i+1);space=false;}}if(space){value=value.slice(0,-1);starts.pop();ends.pop();}return{value,starts,ends};}
function findRange(text,q){const p=project(text),n=project(q).value;if(!n)return null;const at=p.value.indexOf(n);return at<0?null:{start:p.starts[at],end:p.ends[at+n.length-1]};}
function searchChats(q){if(!project(q).value)return ordered.slice(0,10).map(chat=>({chat,recent:true}));return ordered.flatMap(chat=>{const titleRange=findRange(chat.title,q);let hit=null;for(let i=chat.messages.length-1;i>=0&&!hit;i--){for(const field of ['text','quote']){const text=chat.messages[i][field]||'',range=findRange(text,q);if(range){hit={message:i,field,range};break;}}}return titleRange||hit?[{chat,titleRange,hit}]:[];});}
function emphasize(text,q){const range=findRange(text,q);return range?escapeHTML(text.slice(0,range.start))+'<b>'+escapeHTML(text.slice(range.start,range.end))+'</b>'+escapeHTML(text.slice(range.end)):escapeHTML(text);}
function snippet(item,q){if(!item.hit)return '';const text=item.chat.messages[item.hit.message][item.hit.field];const start=Math.max(0,item.hit.range.start-24),end=Math.min(text.length,item.hit.range.end+145);return(start?'…':'')+emphasize(text.slice(start,end).replace(/\s+/g,' '),q)+(end<text.length?'…':'');}
function dateLabel(date){const day=date.slice(0,10);if(day==='2026-09-05')return'今天';if(day==='2026-09-04')return'昨天';const d=new Date(date);return(d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日';}
const notes={results:'标题与正文统一匹配，按会话更新时间倒序。第一条正文命中，第二条仅标题命中。点击任意结果查看落点。',recent:'空输入只显示最近 10 段对话。关闭后重开保留上次查询；清除后回到这里。',title:'这条对话仅标题包含“慢旅行”。没有伪造的正文摘要，打开后沿用普通进入对话的行为。',long:'观察长标题和摘要的单行省略。日期始终保留；标题不会撑开弹窗。',many:'实际匹配 37 段对话，首屏加载 30 条。滚到列表底部，继续加载下一页。',repeat:'最近一条匹配消息内也有重复词。点击后定位它的第一次命中，前面的消息不会标黄。',code:'搜索代码中的 pool_size。标记只覆盖命中文字，不改变代码缩进、字体或复制内容。',quote:'命中位于长引用的三行截断区之外。进入后展开该引用，定位并标黄快照中的文字。',loading:'骨架固定展示，便于检查留白与尺寸。点击“完成请求”可进入模拟搜索结果。',empty:'查询没有匹配项。输入区和弹窗尺寸不变，可以直接修改查询或清除。',history:'模拟新账户，最近对话为空。切换其他场景即可恢复全部 模拟数据。',error:'模拟请求失败，与“无结果”分开。产品内的 重试 可重新查询并恢复结果。','more-error':'首屏仍然可用。向下滚动触发第二页失败，在列表底部重试后继续加载。',stale:'先展示一条有效结果，再模拟点击时消息已归档。打开对话并提示失效，不标错其他内容。',stream:'背景中的回复逐字增长。打开历史结果后保留阅读位置，新的流式文字不会把页面拉到底部。'};

function labState(){const names={ready:'已加载',loading:'加载中',error:'请求失败',invalid:'查询过长'};$('state-search').textContent=state.open?(names[state.status]||state.status):'已关闭';$('state-query').textContent=state.query||'空输入';$('state-count').textContent=Math.min(state.limit,state.items.length)+' / '+state.items.length;$('state-chat').textContent=conversations.find(c=>c.id===state.current)?.title||'新建对话';$('state-nav').textContent=state.nav;document.querySelectorAll('.lab-timeline span').forEach((el,i)=>el.classList.toggle('on',i<state.navStep));$('replay').disabled=!state.lastHit;}

function messageText(message){const text=escapeHTML(message.text);if(message.format==='code')return text.replace(/(create_async_engine|pool_size|max_overflow|pool_timeout|pool_pre_ping)/g,'<span class="syntax">$1</span>');return message.rich?text.replaceAll('连接池','<strong>连接池</strong>').replaceAll('幂等','<strong>幂</strong>等'):text;}
function renderConversation(id){cancelReveal();draftStore.set(state.current,$('composer').value);state.current=id;$('composer').value=draftStore.get(id)||'';const chat=conversations.find(c=>c.id===id);if(!chat){$('messages').innerHTML='<div style="padding-top:15vh;text-align:center"><span class="brand" style="font-size:30px">今天想聊些什么？</span></div>';renderSidebar();labState();return;}
$('messages').innerHTML='<div class="day-divider">'+dateLabel(chat.updated)+'</div>'+chat.messages.map((message,i)=>'<article class="message '+message.role+'" data-message="'+i+'">'+(message.quote?'<div class="quote" data-field="quote">'+escapeHTML(message.quote)+'</div>':'')+(message.text?(message.format==='code'?'<div class="code-wrap"><div class="code-caption"><span>Python</span><button class="icon-btn" data-copy="'+i+'" aria-label="复制代码">'+svg('copy')+'</button></div><pre><code class="message-body" data-field="text">'+messageText(message)+'</code></pre></div>':'<div class="message-body" data-field="text">'+messageText(message)+'</div>'):'')+(message.role==='assistant'?'<div class="message-actions"><button class="icon-btn" data-copy="'+i+'" aria-label="复制回复">'+svg('copy')+'</button><span class="icon-btn" aria-hidden="true">'+svg('like')+'</span><span class="icon-btn" aria-hidden="true">'+svg('sound')+'</span></div>':'')+'</article>').join('');renderSidebar();labState();}
function skeleton(){return Array.from({length:6},()=>'<div class="skeleton-row" aria-hidden="true"><div class="skeleton skeleton-icon"></div><div class="skeleton-copy"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div></div>').join('');}
function renderResults(keepScroll=false){const oldScroll=$('results-scroll').scrollTop;const list=$('results');$('results-scroll').classList.toggle('is-empty',state.status==='error'||(state.status==='ready'&&!state.items.length));$('clear-search').hidden=!state.query;$('validation').hidden=state.status!=='invalid';$('query').setAttribute('aria-invalid',String(state.status==='invalid'));$('query').removeAttribute('aria-activedescendant');$('result-extra').innerHTML='';list.setAttribute('aria-busy',String(state.status==='loading'));if(state.status==='loading'){list.innerHTML=skeleton();}else if(state.status==='error'){list.innerHTML='<div class="empty-state">'+svg('alert')+'<p>搜索失败</p><small>请重试以搜索历史对话。</small><button class="retry" id="retry-search">重试</button></div>';}else if(state.status==='invalid'){list.innerHTML='';}else if(!state.items.length){list.innerHTML='<div class="empty-state">'+svg(state.noHistory?'chat':'search')+'<p>'+(state.noHistory?'暂无历史对话':'没有搜索结果')+'</p></div>';}else{list.innerHTML=(!state.query?'<div class="results-heading" role="presentation">最近对话</div>':'')+state.items.slice(0,state.limit).map((item,i)=>'<div class="result '+(item.recent?'recent':'')+'" role="option" id="result-'+i+'" data-result="'+i+'" aria-selected="'+(i===state.selected)+'">'+svg('chat').replace('<svg','<svg class="result-icon"')+'<div class="result-main"><div class="result-title">'+emphasize(item.chat.title,state.query)+'</div>'+(!item.recent?'<div class="result-snippet">'+snippet(item,state.query)+'</div>':'')+'</div><time class="result-date" datetime="'+item.chat.updated+'" title="'+escapeHTML(new Date(item.chat.updated).toLocaleString('zh-CN'))+'">'+dateLabel(item.chat.updated)+'</time></div>').join('');$('query').setAttribute('aria-activedescendant','result-'+state.selected);renderMore();}if(keepScroll)$('results-scroll').scrollTop=oldScroll;else $('results-scroll').scrollTop=0;labState();}
function renderMore(){const extra=$('result-extra');if(state.limit>=state.items.length){extra.innerHTML='';return;}if(state.more==='error'){extra.innerHTML='<div class="more-state"><p>加载更多结果失败</p><button class="retry" id="retry-more">重试</button></div>';}else if(state.more==='loading'){extra.innerHTML='<div class="more-state"><span class="spinner" aria-label="正在加载更多结果"></span></div>';}else{extra.innerHTML='<div class="more-state"><button class="retry" id="load-more">加载更多</button></div>';}}
function settleSearch(){state.items=state.noHistory?[]:searchChats(state.query);state.selected=0;state.limit=30;state.more='idle';state.status='ready';renderResults();announce(state.items.length?state.items.length+' 条匹配对话':state.noHistory?'暂无历史对话':'没有搜索结果');}
function queryChanged(){clearTimeout(searchTimer);clearTimeout(requestTimer);clearTimeout(moreTimer);querySequence++;state.query=$('query').value;state.savedScroll=0;state.more='idle';if([...state.query.trim()].length>200){state.status='invalid';state.items=[];renderResults();return;}if(!project(state.query).value){state.query='';settleSearch();return;}state.status='loading';state.items=[];renderResults();const request=querySequence;searchTimer=setTimeout(()=>{requestTimer=setTimeout(()=>{if(request!==querySequence||!state.open)return;settleSearch();},160);},250);}
function openSearch(trigger){searchTrigger=trigger||document.activeElement;$('sidebar').classList.remove('mobile-open');$('drawer-cover').classList.remove('open');$('recent-popover').hidden=true;state.open=true;$('search-layer').hidden=false;$('product-shell').inert=true;$('product-shell').setAttribute('aria-hidden','true');$('query').value=state.query;if(state.status==='loading'&&state.scenario!=='loading')settleSearch();else renderResults();$('results-scroll').scrollTop=state.savedScroll;$('query').focus();labState();}
function closeSearch(restoreFocus=true){state.savedScroll=$('results-scroll').scrollTop;state.open=false;querySequence++;clearTimeout(searchTimer);clearTimeout(requestTimer);clearTimeout(moreTimer);if(state.more==='loading')state.more='idle';$('search-layer').hidden=true;$('product-shell').inert=false;$('product-shell').removeAttribute('aria-hidden');if(restoreFocus){const target=searchTrigger?.isConnected?searchTrigger:$('open-search');target.focus();}labState();}
function selectResult(index){state.selected=Math.max(0,Math.min(index,Math.min(state.items.length,state.limit)-1));document.querySelectorAll('[data-result]').forEach(el=>el.setAttribute('aria-selected',String(Number(el.dataset.result)===state.selected)));$('query').setAttribute('aria-activedescendant','result-'+state.selected);const el=$('result-'+state.selected);if(el){const r=el.getBoundingClientRect(),box=$('results-scroll').getBoundingClientRect();if(r.top<box.top)$('results-scroll').scrollTop-=box.top-r.top;else if(r.bottom>box.bottom)$('results-scroll').scrollTop+=r.bottom-box.bottom;}labState();}
function loadMore(retry=false){if(state.more==='loading'||state.limit>=state.items.length)return;if(state.more==='error'&&!retry)return;state.more='loading';renderMore();moreTimer=setTimeout(()=>{if(!state.open)return;if(state.scenario==='more-error'&&!retry){state.more='error';renderMore();return;}state.limit+=30;state.more='idle';renderResults(true);announce('已加载更多对话');},650);}
function cancelReveal(){navSequence++;document.querySelectorAll('.message mark').forEach(el=>el.replaceWith(document.createTextNode(el.textContent)));document.querySelectorAll('.quote.revealed').forEach(el=>el.classList.remove('revealed'));}
function wrapRange(root,range){const nodes=[],walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node,offset=0;while(node=walker.nextNode()){nodes.push({node,start:offset,end:offset+node.textContent.length});offset+=node.textContent.length;}const marks=[];for(const part of nodes.reverse()){if(part.end<=range.start||part.start>=range.end)continue;const a=Math.max(0,range.start-part.start),b=Math.min(part.node.length,range.end-part.start);part.node.splitText(b);const middle=part.node.splitText(a);const mark=document.createElement('mark');middle.replaceWith(mark);mark.appendChild(middle);marks.unshift(mark);}return marks;}
function reveal(item,q){cancelReveal();const sequence=navSequence,root=$('thread-region');const target=$('messages').querySelector('[data-message="'+item.hit.message+'"] [data-field="'+item.hit.field+'"]');if(!target){toast('该搜索结果已失效','error');setNav('目标失效',0);return;}const range=findRange(target.textContent,q);if(!range){toast('该搜索结果已失效','error');setNav('目标失效',0);return;}if(item.hit.field==='quote')target.classList.add('revealed');const marks=wrapRange(target,range);if(!marks.length)return;const reduced=$('reduced').checked||matchMedia('(prefers-reduced-motion: reduce)').matches;marks.forEach(mark=>mark.classList.toggle('no-motion',reduced));setNav('滚动到命中文字',2);const top=Math.max(0,Math.min(root.scrollHeight-root.clientHeight,root.scrollTop+marks[0].getBoundingClientRect().top-root.getBoundingClientRect().top-Math.min(150,root.clientHeight*.22)));root.scrollTo({top,behavior:reduced?'instant':'smooth'});let previous=root.scrollTop,stable=0,start=performance.now();function follow(){if(sequence!==navSequence)return;const next=root.scrollTop;stable=Math.abs(next-previous)<.5?stable+1:0;previous=next;if((stable>4&&Math.abs(next-top)<2)||performance.now()-start>1800){marks.forEach(mark=>mark.classList.add('lit'));setNav('淡黄色标记 · 保持 2 秒',3);setTimeout(()=>{if(sequence!==navSequence)return;marks.forEach(mark=>mark.classList.remove('lit'));setNav(reduced?'标记结束':'淡出 · 1 秒',4);setTimeout(()=>{if(sequence!==navSequence)return;marks.forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)));setNav('定位完成',4);},reduced?0:1000);},2000);}else requestAnimationFrame(follow);}requestAnimationFrame(follow);}
function openResult(item){if(!item)return;const query=state.query;closeSearch(false);renderConversation(item.chat.id);$('messages').focus({preventScroll:true});if(state.scenario==='stale'&&item.hit){$('thread-region').scrollTop=0;setNav('消息已归档 · 不标记',0);toast('该搜索结果已失效','error');return;}if(item.hit){state.lastHit={item,query};setNav('会话已打开',1);$('thread-region').scrollTop=0;requestAnimationFrame(()=>reveal(item,query));}else{$('thread-region').scrollTop=$('thread-region').scrollHeight;setNav('普通打开 · 无正文目标',0);}labState();}
function startStream(){clearInterval(streamTimer);let draft='';const text='我会保留这些观测结果。下一步可以先选一段高峰期的请求，把连接等待与实际执行时间画在同一条时间线上。这样更容易判断变化发生在哪个阶段。';streamTimer=setInterval(()=>{if(state.scenario!=='stream'){clearInterval(streamTimer);return;}if(state.current!=='db')return;let row=$('stream-message');if(!row){row=document.createElement('article');row.id='stream-message';row.className='message';$('messages').appendChild(row);}draft+=text[draft.length%text.length];row.innerHTML='<div class="message-body">'+escapeHTML(draft)+'<span class="stream-cursor" aria-hidden="true"></span></div>';},180);}
function setScenario(name){clearTimeout(searchTimer);clearTimeout(requestTimer);clearTimeout(moreTimer);clearInterval(streamTimer);querySequence++;cancelReveal();const wasEmpty=state.noHistory;state.scenario=name;state.noHistory=name==='history';if(state.noHistory)renderConversation('new');else if(wasEmpty)renderConversation('db');state.query=sceneQueries[name];state.items=[];state.limit=30;state.selected=0;state.savedScroll=0;state.more='idle';state.lastHit=null;setNav('未定位',0);$('scenario').value=name;$('scenario-note').textContent=notes[name];$('finish-load').hidden=name!=='loading';if(name==='stream'){renderConversation('db');startStream();}state.status='ready';settleSearch();if(name==='loading')state.status='loading';if(name==='error')state.status='error';openSearch($('lab-open'));}
$('query').addEventListener('compositionstart',()=>{composing=true;clearTimeout(searchTimer);clearTimeout(requestTimer);querySequence++;});$('query').addEventListener('compositionend',()=>{composing=false;queryChanged();});$('query').addEventListener('input',()=>{if(!composing)queryChanged();});
$('query').addEventListener('keydown',event=>{if(event.isComposing||composing)return;if(state.status==='ready'&&state.items.length){if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();selectResult(state.selected+(event.key==='ArrowDown'?1:-1));}if(event.key==='Enter'){event.preventDefault();openResult(state.items[state.selected]);}}});
$('search-dialog').addEventListener('keydown',event=>{if(event.isComposing||composing)return;if(event.key==='Escape'){event.preventDefault();closeSearch();}if(event.key==='Tab'){const focusables=[...$('search-dialog').querySelectorAll('input,button')].filter(el=>!el.hidden&&!el.closest('[hidden]')&&!el.disabled);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
$('results').addEventListener('click',event=>{const row=event.target.closest('[data-result]');if(row)openResult(state.items[Number(row.dataset.result)]);if(event.target.closest('#retry-search')){$('query').value=state.query;queryChanged();}});
$('results').addEventListener('pointermove',event=>{const row=event.target.closest('[data-result]');if(row&&state.selected!==Number(row.dataset.result))selectResult(Number(row.dataset.result));});
$('result-extra').addEventListener('click',event=>{if(event.target.closest('#retry-more'))loadMore(true);if(event.target.closest('#load-more'))loadMore();});
$('results-scroll').addEventListener('scroll',()=>{if(state.open&&state.status==='ready'&&state.more==='idle'&&$('results-scroll').scrollTop+$('results-scroll').clientHeight>=$('results-scroll').scrollHeight-35)loadMore();});
$('clear-search').onclick=()=>{$('query').value='';queryChanged();$('query').focus();};$('close-search').onclick=()=>closeSearch();$('search-backdrop').onclick=()=>closeSearch();$('open-search').onclick=event=>openSearch(event.currentTarget);$('lab-open').onclick=event=>openSearch(event.currentTarget);
$('scenario').onchange=event=>setScenario(event.target.value);document.querySelectorAll('[data-query]').forEach(button=>button.onclick=()=>{state.noHistory=false;state.scenario='results';$('scenario').value='results';$('scenario-note').textContent=notes.results;$('finish-load').hidden=true;openSearch(button);$('query').value=button.dataset.query;queryChanged();});
$('finish-load').onclick=()=>{settleSearch();$('finish-load').hidden=true;};$('replay').onclick=()=>{if(state.lastHit){const {item,query}=state.lastHit;state.query=query;openResult(item);}};
function setRail(collapsed){$('sidebar').classList.toggle('collapsed',collapsed);$('rail').checked=collapsed;$('sidebar-toggle').setAttribute('aria-label',collapsed?'展开侧栏':'收起侧栏');$('sidebar-toggle').title=collapsed?'展开侧栏':'收起侧栏';}
$('rail').onchange=event=>setRail(event.target.checked);$('sidebar-toggle').onclick=()=>{if($('device').clientWidth<=760){$('sidebar').classList.remove('mobile-open');$('drawer-cover').classList.remove('open');}else setRail(!$('sidebar').classList.contains('collapsed'));};$('mobile-menu').onclick=()=>{$('sidebar').classList.add('mobile-open');$('drawer-cover').classList.add('open');};$('drawer-cover').onclick=()=>{$('sidebar').classList.remove('mobile-open');$('drawer-cover').classList.remove('open');};$('recent-toggle').onclick=()=>{$('recent-popover').hidden=!$('recent-popover').hidden;};
for(const id of ['sidebar-list','recent-list'])$(id).onclick=event=>{const button=event.target.closest('[data-chat]');if(button){renderConversation(button.dataset.chat);$('thread-region').scrollTop=$('thread-region').scrollHeight;$('sidebar').classList.remove('mobile-open');$('drawer-cover').classList.remove('open');$('recent-popover').hidden=true;setNav('普通打开',0);}};
function newChat(){renderConversation('new');$('sidebar').classList.remove('mobile-open');$('drawer-cover').classList.remove('open');$('composer').focus();} $('new-chat').onclick=newChat;$('mobile-new').onclick=newChat;
$('messages').onclick=async event=>{const button=event.target.closest('[data-copy]');if(!button)return;const message=conversations.find(c=>c.id===state.current).messages[Number(button.dataset.copy)];try{await navigator.clipboard.writeText(message.text);toast('已复制');}catch{toast('当前预览无法复制');}};
$('share-demo').onclick=()=>toast('当前预览暂不支持分享');$('attach-demo').onclick=()=>toast('当前预览暂不支持附件');
$('thread-region').addEventListener('scroll',()=>{$('scroll-bottom').hidden=$('thread-region').scrollHeight-$('thread-region').clientHeight-$('thread-region').scrollTop<136;});$('scroll-bottom').onclick=()=>{cancelReveal();$('thread-region').scrollTo({top:$('thread-region').scrollHeight,behavior:$('reduced').checked?'instant':'smooth'});setNav('返回最新消息',0);};
for(const type of ['wheel','touchstart'])$('thread-region').addEventListener(type,()=>{if(state.navStep===2){cancelReveal();$('thread-region').scrollTo({top:$('thread-region').scrollTop,behavior:'instant'});setNav('已停止自动定位',0);}},{passive:true});
$('reduced').onchange=event=>{$('device').classList.toggle('reduced-motion',event.target.checked);};
$('panel-toggle').onclick=()=>{const hidden=$('lab-work').classList.toggle('panel-hidden');$('panel-toggle').textContent=hidden?'场景面板':'收起面板';$('panel-toggle').setAttribute('aria-expanded',String(!hidden));};
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{const mobile=button.dataset.view==='mobile';$('workspace').classList.toggle('mobile-preview',mobile);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
if(innerWidth<=620){$('lab-work').classList.add('panel-hidden');$('panel-toggle').textContent='场景面板';$('panel-toggle').setAttribute('aria-expanded','false');}
// Desktop dialogs sit slightly above viewport center; mobile previews keep their device bounds.
function syncSearchContainer(){const viewport=$('device').clientWidth>760&&!$('workspace').classList.contains('mobile-preview');const parent=viewport?document.body:$('device');if($('search-layer').parentElement!==parent)parent.appendChild($('search-layer'));$('search-layer').classList.toggle('viewport-search',viewport);if(state.open)$('query').focus({preventScroll:true});}
new ResizeObserver(syncSearchContainer).observe($('device'));
syncSearchContainer();
renderConversation('db');$('thread-region').scrollTop=80;setScenario('results');
</script>
