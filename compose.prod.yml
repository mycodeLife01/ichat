name: ichat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    # Bumped from default 100 to cover the API and worker SQLAlchemy pools.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    # Bind to loopback only: reachable from the host (and via SSH tunnel), never
    # exposed to the public internet. Use Navicat's built-in SSH tunnel to connect.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Shared broker/cache/stream transport. noeviction protects Celery and streams.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    env_file:
      - .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  api:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    restart: unless-stopped
    env_file:
      - .env
    # Executes email and finite LLM tasks (conversation titles). Safe to scale to N.
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-worker:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--queues=media", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/${GITHUB_REPO:-mycodelife01/ichat}:latest
    # Schedules email and avatar maintenance. MUST stay a single instance
    # (multiple beats double-schedule); restart + monitor this single point.
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
